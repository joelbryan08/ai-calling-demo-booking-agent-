<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dexkor Calling</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1630;--cream:#F4EDDC;--gold:#E0A93F;--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.13);--line:rgba(255,255,255,.17);--mut:rgba(244,237,220,.62);--ok:#6FE0A8;--bad:#FF8A73;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth;color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--cream);font:15px/1.55 Inter,system-ui,sans-serif;background:var(--navy);background-image:radial-gradient(1200px 700px at 85% -10%,color-mix(in srgb,var(--navy) 55%,#3d6fd8),transparent 60%),radial-gradient(900px 600px at -10% 110%,color-mix(in srgb,var(--navy) 60%,#2a4a9a),transparent 60%);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
body::before{background:radial-gradient(circle,var(--gold),transparent 65%);top:-18vmax;left:-12vmax}
body::after{background:radial-gradient(circle,#4f86ff,transparent 65%);bottom:-22vmax;right:-14vmax;animation-duration:30s;animation-direction:alternate-reverse;opacity:.4}
h1,h2,.brand,.num{font-family:Fraunces,Georgia,serif;letter-spacing:-.03em}
h1{font-size:58px;font-weight:700;margin:0;line-height:1}h1::after{content:"";display:block;width:76px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:14px;box-shadow:0 0 22px var(--gold)}
h2{font-size:22px;font-weight:600;margin:0 0 16px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}.eyebrow::before{content:"● ";color:var(--gold);font-size:9px}
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
aside,.card,.modal .card,.login .card{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);box-shadow:0 18px 50px rgba(2,8,24,.4),inset 0 1px 0 rgba(255,255,255,.22)}
aside{margin:16px;border-radius:24px;padding:28px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;height:calc(100vh - 32px)}
.brand{font-weight:700;font-size:36px;padding:0 14px;margin-bottom:30px;line-height:1}.brand i{color:var(--gold);font-style:normal;text-shadow:0 0 18px var(--gold)}
aside .brand::after{content:"CALLING CONSOLE";display:block;font:500 10px var(--mono);letter-spacing:.22em;color:var(--mut);margin-top:8px}
aside a{color:var(--mut);text-decoration:none;padding:12px 16px;border-radius:14px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .25s var(--ease);border:1px solid transparent}
aside a:hover{color:var(--cream);background:var(--glass);transform:translateX(4px)}aside a.on{color:#1a1204;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 60%,#fff));font-weight:600;box-shadow:0 8px 26px color-mix(in srgb,var(--gold) 45%,transparent)}aside .sp{flex:1}
main{padding:48px 52px 90px;max-width:1260px;width:100%}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:36px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}.two{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.card{position:relative;border-radius:22px;padding:24px 26px;transition:transform .3s var(--ease),box-shadow .3s,background .3s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.16),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}.card:hover::before{opacity:1}
.stat:hover{transform:translateY(-5px);box-shadow:0 26px 60px rgba(2,8,24,.5),inset 0 1px 0 rgba(255,255,255,.28)}.stat .num{font-size:70px;font-weight:700;line-height:.95;margin-top:10px}
.stats .card:first-child{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 38%,transparent),var(--glass))}
table{width:100%;border-collapse:collapse}th{text-align:left;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:0 12px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-top:1px solid rgba(255,255,255,.08);vertical-align:middle;font-variant-numeric:tabular-nums;transition:background .2s}
tr.click{cursor:pointer}tr.click:hover td{background:var(--glass2)}tr.click:hover td:first-child{border-radius:12px 0 0 12px}tr.click:hover td:last-child{border-radius:0 12px 12px 0}
.mut{color:var(--mut)}a{color:var(--gold);font-weight:600;text-underline-offset:3px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--glass2);border:1px solid var(--line);color:var(--cream)}
.pill.running,.pill.in_progress{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.pill.completed,.pill.done,.pill.booked,.pill.answered{color:var(--ok);border-color:rgba(111,224,168,.5);background:rgba(111,224,168,.13)}.pill.cancelled,.pill.failed{color:var(--bad);border-color:rgba(255,138,115,.5);background:rgba(255,138,115,.13)}
.btn{position:relative;overflow:hidden;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;color:#1a1204;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 60%,#fff));box-shadow:0 8px 26px color-mix(in srgb,var(--gold) 38%,transparent);transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px color-mix(in srgb,var(--gold) 50%,transparent)}.btn:active{transform:translateY(1px) scale(.98)}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s}.btn:hover::after{left:130%}
.btn.ghost{color:var(--cream);background:var(--glass2);border:1px solid var(--line);box-shadow:none;backdrop-filter:blur(12px)}.btn.bad{color:var(--bad);background:rgba(255,138,115,.1);border:1px solid rgba(255,138,115,.5);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);color:var(--cream);width:100%;outline:none;transition:all .2s;backdrop-filter:blur(10px)}
input::placeholder,textarea::placeholder{color:var(--mut)}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent);background:rgba(255,255,255,.1)}textarea{min-height:84px}
input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:10px;padding:7px 14px;background:var(--glass2);color:var(--cream);font:600 11px var(--mono);cursor:pointer}
label{display:block;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 14px}.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--cream))}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:30px 0 18px}.tabs a{padding:8px 0;cursor:pointer;color:var(--mut);font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;margin-bottom:-1px;transition:color .2s}.tabs a:hover{color:var(--cream)}.tabs a.on{color:var(--gold);border-bottom:3px solid var(--gold)}
.modal{position:fixed;inset:0;background:rgba(4,10,28,.55);backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;z-index:9;animation:fade .2s}
.modal .card{width:min(580px,100%);max-height:88vh;overflow:auto;background:rgba(18,32,66,.72);animation:pop2 .35s var(--ease)}
.msg{padding:10px 15px;margin:8px 0;max-width:86%;border-radius:18px 18px 18px 6px;background:var(--glass2);border:1px solid var(--line)}.msg.c{margin-left:auto;border-radius:18px 18px 6px 18px;background:color-mix(in srgb,var(--gold) 24%,transparent);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(410px,100%);padding:34px}.login .brand{padding:0;font-size:54px}
.note{background:var(--glass);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:14px}
.cols{display:flex;gap:6px;align-items:flex-end}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}.col .bars{display:flex;gap:2px;align-items:flex-end;height:130px}
.bars i,.bars b{width:9px;min-height:2px;border-radius:5px 5px 0 0;background:rgba(244,237,220,.78)}.bars b{background:var(--gold);box-shadow:0 0 14px var(--gold)}.col span{font:500 10px var(--mono);color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:10px;box-shadow:0 0 12px var(--ok);animation:p 1.4s ease-in-out infinite}.lv{max-height:340px;overflow:auto}
.toast{position:fixed;right:24px;bottom:24px;background:rgba(18,32,66,.8);backdrop-filter:blur(18px);color:var(--cream);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:16px;box-shadow:0 14px 40px rgba(2,8,24,.5),0 0 28px color-mix(in srgb,var(--gold) 30%,transparent);padding:13px 20px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;z-index:20;animation:toast 2.8s both}
.cf{position:fixed;bottom:30vh;width:10px;height:10px;border-radius:3px;z-index:30;pointer-events:none;animation:cf 1.5s var(--ease) both}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--glass2);border-radius:9px}
@keyframes drift{to{transform:translate(14vw,10vh) scale(1.2)}}@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985);filter:blur(6px)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes up{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(.55);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.96);filter:blur(8px)}}@keyframes p{50%{opacity:.35;transform:scale(.8)}}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent)}}@keyframes slide{from{opacity:0;transform:translateY(10px) scale(.97)}}@keyframes pop2{from{transform:translateY(18px) scale(.95);opacity:0}}
@keyframes toast{0%{transform:translateY(26px);opacity:0}10%,85%{transform:none;opacity:1}100%{transform:translateX(30px);opacity:0}}
@keyframes cf{40%{transform:translate(calc(var(--x)*.6),var(--y)) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--x),35vh) rotate(var(--r));opacity:0}}
body[data-fresh="1"] main>*{animation:rise .65s var(--ease) both}
body[data-fresh="1"] main>*:nth-child(2){animation-delay:.07s}body[data-fresh="1"] main>*:nth-child(3){animation-delay:.14s}body[data-fresh="1"] main>*:nth-child(4){animation-delay:.21s}body[data-fresh="1"] main>*:nth-child(n+5){animation-delay:.28s}
body[data-fresh="1"] .stats .card{animation:rise .65s var(--ease) both}body[data-fresh="1"] .stats .card:nth-child(2){animation-delay:.09s}body[data-fresh="1"] .stats .card:nth-child(3){animation-delay:.18s}body[data-fresh="1"] .stats .card:nth-child(4){animation-delay:.27s}
body[data-fresh="1"] aside{animation:rise .7s var(--ease) both}
body[data-fresh="1"] tr{animation:rise .45s var(--ease) both}body[data-fresh="1"] tr:nth-child(n+2){animation-delay:.05s}body[data-fresh="1"] tr:nth-child(n+4){animation-delay:.1s}body[data-fresh="1"] tr:nth-child(n+6){animation-delay:.15s}body[data-fresh="1"] tr:nth-child(n+8){animation-delay:.2s}
body[data-fresh="1"] .bar b{transform-origin:left;animation:grow 1s var(--ease) .25s both}
body[data-fresh="1"] .bars i,body[data-fresh="1"] .bars b{transform-origin:bottom;animation:up .8s var(--ease) .3s both}body[data-fresh="1"] .col:nth-child(3n+2) .bars *{animation-delay:.38s}body[data-fresh="1"] .col:nth-child(3n) .bars *{animation-delay:.46s}
body[data-fresh="1"] .pill{animation:pop .4s cubic-bezier(.3,1.6,.5,1) .3s both}body[data-fresh="1"] .login .card{animation:drop .7s var(--ease) both}
.pill.running,.pill.in_progress{animation:glow 1.8s ease-in-out infinite}.msg.pop{animation:slide .35s var(--ease)}
.tp{display:flex;align-items:center;gap:2px;padding:2px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.06);width:max-content;outline:none;transition:border-color .2s,box-shadow .2s}.tp:focus-within,.tp:hover{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.tp b{font:600 20px var(--mono);color:var(--mut);margin:0 2px}.tp .ap{font:600 10px var(--mono);letter-spacing:.1em;color:var(--gold);margin-left:8px;width:22px}
.dr{display:flex;flex-direction:column;align-items:center;height:84px;overflow:hidden;cursor:ns-resize;user-select:none;padding:0 8px;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.dr i,.dr u{display:block;font:500 15px/28px var(--mono);font-style:normal;color:var(--mut);text-decoration:none;opacity:.55}.dr u{font:700 24px/28px var(--mono);color:var(--cream);opacity:1}
.dr.dn i,.dr.dn u{animation:tick .22s var(--ease)}.dr.up i,.dr.up u{animation:tick2 .22s var(--ease)}@keyframes tick{from{transform:translateY(14px);opacity:.15}}@keyframes tick2{from{transform:translateY(-14px);opacity:.15}}
.kebab{position:relative}.dots{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);color:var(--cream);font-size:22px;line-height:1;cursor:pointer;transition:all .25s var(--ease)}.dots:hover{background:var(--glass);transform:rotate(90deg)}
.pop{position:absolute;right:0;top:46px;width:270px;z-index:5;padding:16px;border-radius:18px;background:rgba(18,32,66,.94);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 18px 44px rgba(2,8,24,.55);display:none}.pop.on{display:block;animation:pop2 .25s var(--ease)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:600 12px var(--mono);padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--cream);cursor:pointer;transition:all .2s var(--ease)}.chip:hover{transform:translateY(-2px);background:var(--glass2)}
.chip.on{color:#1a1204;border-color:transparent;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 60%,#fff));box-shadow:0 6px 20px color-mix(in srgb,var(--gold) 40%,transparent)}
#tc{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:20;pointer-events:none}
.toast{position:relative;right:auto;bottom:auto;padding-left:38px;animation:tin .6s cubic-bezier(.2,1.1,.3,1) both}.toast::before{content:"";position:absolute;left:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.toast.ok::before{background:var(--ok);box-shadow:0 0 12px var(--ok)}.toast.out{animation:tout .4s ease both}@keyframes tin{from{transform:translateX(120%);opacity:0}}@keyframes tout{to{transform:translateX(120%);opacity:0}}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px;margin:10px;border-radius:18px}.brand{margin:0 14px 0 0;padding:0;font-size:26px}aside .brand::after{display:none}aside a{padding:8px 12px}aside .sp{display:none}
main{padding:24px 16px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}h1{font-size:40px}.card{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');let tok=sessionStorage.dx||'',tab='leads',timer,lastKey='',lastDemos=null,seen={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=s=>s?new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s)?s:s+'Z').toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'–';
const pill=s=>`<span class="pill ${esc(s)}">${esc(String(s||'in progress').replace('_',' '))}</span>`;
async function api(p,o={}){const h={};if(tok)h.Authorization='Bearer '+tok;if(o.json){h['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
 const r=await fetch(p,{...o,headers:h});if(r.status===401&&p!=='/api/login'){logout();throw 0}
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Something is wrong with that input');return d}
function toast(m,kind){let c=$('#tc');if(!c){c=document.createElement('div');c.id='tc';document.body.append(c)}const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=m;c.append(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),450)},3800)}
let cmap=null,wt;
async function watch(){try{const l=await api('/campaigns');if(cmap)for(const c of l){const o=cmap[c.id];if(o&&o!==c.status){if(o==='draft'&&c.status==='running')toast(`▶  ${c.name} started`);if(c.status==='completed')toast(`✓  ${c.name} completed`,'ok')}}cmap=Object.fromEntries(l.map(c=>[c.id,c.status]))}catch(x){}}
function drum(el){let h=+el.dataset.v.slice(0,2),mi=+el.dataset.v.slice(3);const hid=document.createElement('input');hid.type='hidden';hid.name=el.dataset.name;el.after(hid);
 el.innerHTML='<div class="dr" data-k="h"></div><b>:</b><div class="dr" data-k="m"></div><small class="ap"></small>';el.tabIndex=0;
 const pad=n=>String(n).padStart(2,'0'),rows=(v,max,st)=>[(v-st+max)%max,v,(v+st)%max].map((n,i)=>i==1?`<u>${pad(n)}</u>`:`<i>${pad(n)}</i>`).join('');
 const draw=(k,dir)=>{const d=el.querySelector(`[data-k=${k}]`);d.innerHTML=k=='h'?rows(h,24,1):rows(mi,60,5);d.classList.remove('up','dn');void d.offsetWidth;if(dir)d.classList.add(dir>0?'dn':'up');hid.value=pad(h)+':'+pad(mi);el.querySelector('.ap').textContent=h<12?'AM':'PM'};
 const step=(k,dir)=>{if(k=='h')h=(h+dir+24)%24;else mi=(mi+dir*5+60)%60;draw(k,dir)};draw('h');draw('m');
 el.querySelectorAll('.dr').forEach(d=>{const k=d.dataset.k;d.addEventListener('wheel',e=>{e.preventDefault();step(k,e.deltaY>0?1:-1)},{passive:false});
  d.onclick=e=>{const r=e.target.closest('i');if(r)step(k,r===d.firstElementChild?-1:1)};d.onmouseenter=()=>el.dataset.k=k});
 el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();step(el.dataset.k||'h',e.key==='ArrowDown'?1:-1)}})}
function newCampaign(){const gaps=[[5,'5 min'],[15,'15 min'],[30,'30 min'],[60,'1 hour'],[120,'2 hours'],[240,'4 hours']];
 const m=modal(`<form id="nf"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">New campaign</h2><div class="kebab"><button type="button" class="dots" id="kb" title="More options">⋮</button><div class="pop" id="kp"><label style="margin-top:0">Caller number</label><input name="caller_number" placeholder="+91…"><p class="mut" style="margin:8px 0 0;font-size:13px">Optional. Blank uses your default number.</p></div></div></div>
<label>Name</label><input name="name" required placeholder="e.g. November leads">
<label>Calling window</label><div class="row"><div class="tp" data-name="window_start" data-v="10:00"></div><span class="mut">to</span><div class="tp" data-name="window_end" data-v="20:00"></div></div><p class="mut" style="margin:6px 0 0;font-size:13px">Scroll the numbers with your mouse wheel.</p>
<div class="row"><div style="flex:1"><label>Calls at once</label><input name="max_parallel" type="number" min="1" value="1"></div><div style="flex:1"><label>Max attempts</label><input name="max_attempts" type="number" min="1" value="2"></div></div>
<label>Wait between retries</label><div class="chips">${gaps.map(([v,l])=>`<button type="button" class="chip${v===120?' on':''}" data-v="${v}">${l}</button>`).join('')}</div><input type="hidden" name="retry_gap_minutes" value="120">
<p id="e" style="color:var(--bad);min-height:20px"></p><button class="btn">Create campaign</button></form>`);
 const f=m.querySelector('form'),kp=m.querySelector('#kp');m.querySelectorAll('.tp').forEach(drum);
